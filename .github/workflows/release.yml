name: Release
# Push a tag vX.Y.Z (matching package.json "version", with a "## X.Y.Z" section in
# CHANGELOG.md). Builds Windows and one universal Mac DMG, uploads them to a draft release whose notes
# are that changelog section, and publishes it only when every build passed. The apps'
# in-app updater (electron/updater.js) then offers it. See docs/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json, changelog has the version
        run: |
          V="$(node -p 'require("./package.json").version')"
          [ "$TAG" = "v$V" ] || { echo "::error::Tag $TAG does not match package.json version $V"; exit 1; }
          awk -v v="$V" '/^## /{ if (on) exit; on = ($2 == v); next } on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no '## $V' section"; exit 1; }
          cat notes.md
      - name: Draft release (kept as a draft until all builds are uploaded)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then gh release edit "$TAG" --notes-file notes.md
          else gh release create "$TAG" --draft --verify-tag --title "AV Backup ${TAG#v}" --notes-file notes.md; fi

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          choco install ffmpeg -y --no-progress
          npm ci
      - name: Tests
        run: |
          python -m pytest tests/ -q
          npm run test:renderer
      - name: Build installer and portable zip
        run: |
          # The real binaries, not Chocolatey's PATH shims, go into the engine.
          FF="$(dirname "$(find /c/ProgramData/chocolatey/lib/ffmpeg -name ffprobe.exe | head -1)")"
          npm run bundle:python -- --with-ffmpeg "$(cygpath -w "$FF")"
          npx --no-install electron-builder --win --publish never
      - name: Upload to the draft release
        run: |
          V="${TAG#v}"
          # latest.yml and the .blockmap let installed copies download only what changed.
          gh release upload "$TAG" --clobber "dist/AV-Backup-Setup-$V.exe" "dist/AV-Backup-Setup-$V.exe.blockmap" \
            dist/latest.yml "dist/AV-Backup-$V-win.zip"

  mac:
    # Each chip's engine (PyInstaller + ffmpeg) is built natively on its own runner.
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies, test, and freeze the engine
        run: bash scripts/macos.sh engine
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.arch }}
          path: dist-python/vingest-core
          if-no-files-found: error
          retention-days: 1

  mac-universal:
    # One DMG for Apple Silicon and Intel: both engines inside, the app starts the one for
    # this Mac's chip (electron/python-bridge.js). Electron itself is merged by electron-builder.
    needs: mac
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: engines
      - name: Build the universal DMG
        run: |
          mkdir -p dist-python
          for a in arm64 x64; do install -m 755 "engines/engine-$a/vingest-core" "dist-python/vingest-core-$a"; done
          file dist-python/*
          npm ci
          npx --no-install electron-builder --mac dmg --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Every binary runs on macOS 12
        run: |
          python -m pip install pyinstaller macholib
          python scripts/check_macos_min.py dist
      - name: Upload to the draft release
        run: gh release upload "$TAG" --clobber "dist/AV-Backup-${TAG#v}-mac-universal.dmg"

  publish:
    needs: [windows, mac-universal]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
