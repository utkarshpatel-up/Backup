<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>AV Backup</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="sidebar">
    <div class="brand">
      <img class="team-logo" src="assets/team-logo.jpg" alt="AV team logo" />
      <h1>AV Backup</h1>
      <div class="backup-mode" id="backupMode">Formal backup</div>
      <p>Camera originals &rarr; house structure</p>
    </div>
    <ul class="steps" id="steps"></ul>
    <section class="team" id="team" aria-label="Team server">
      <div class="team-head"><span>Team server</span><button class="sm ghost" id="btnTeamAccount" aria-label="Open Account settings">Account</button></div>
      <div id="teamLines" aria-live="polite"><div class="team-line">Checking&hellip;</div></div>
    </section>
    <div class="engine" id="engine">
      <span class="dot" id="engineDot"></span>
      <span id="engineText">Starting engine&hellip;</span>
    </div>
    <div class="update" id="update" aria-live="polite"></div>
  </nav>
  <dialog class="update-notes" id="updateNotes" aria-labelledby="updateNotesTitle">
    <h3 id="updateNotesTitle"></h3>
    <pre id="updateNotesBody"></pre>
    <form method="dialog"><button class="primary">Close</button></form>
  </dialog>

  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="stepTitle">Sources</h2>
        <p id="stepHint"></p>
      </div>
      <div class="actions" id="topActions"></div>
    </header>
    <div class="content" id="content"></div>
    <div class="footer-actions" id="footer"></div>
  </main>

  <div class="modal-host" id="modal"></div>
  <div class="toast-wrap" id="toasts"></div>
  <script src="paint.js"></script>
  <script src="selection-logic.js"></script>
  <script src="naming-ui.js"></script>
  <script src="schedule-logic.js"></script>
  <script src="schedule-vocab.js"></script>
  <script src="schedule-cities.js"></script>
  <script src="schedule-ui.js"></script>
  <script src="report-ui.js"></script>
  <script src="sync-ui.js"></script>
  <script src="update-ui.js"></script>
  <script src="app.js"></script>
  <script src="team-ui.js"></script>
</body>
</html>
